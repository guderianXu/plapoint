name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PlaPoint
        uses: actions/checkout@v7
        with:
          path: plapoint
      - name: Check out PlaMatrix
        uses: actions/checkout@v7
        with:
          repository: guderianXu/plamatrix
          ref: 72489499a7df3e65a0af6aae9446b1d41051a9b7
          path: plamatrix
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libeigen3-dev libgtest-dev ninja-build
      - name: Build and install CPU PlaMatrix
        run: |
          cmake -S plamatrix -B build/plamatrix -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/deps" \
            -DPLAMATRIX_WITH_CUDA=OFF \
            -DPLAMATRIX_WITH_OPENCL=OFF \
            -DPLAMATRIX_BUILD_TESTS=OFF \
            -DPLAMATRIX_BUILD_BENCHMARKS=OFF
          cmake --build build/plamatrix --target install
      - name: Configure PlaPoint CPU tests
        run: |
          cmake -S plapoint -B build/plapoint -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps" \
            -DPLAPOINT_WITH_CUDA=OFF \
            -DPLAPOINT_WITH_OPENCL=OFF \
            -DPLAPOINT_BUILD_TESTS=ON \
            -DPLAPOINT_BUILD_BENCHMARKS=OFF
      - name: Build and test PlaPoint
        run: |
          cmake --build build/plapoint
          ctest --test-dir build/plapoint --output-on-failure
      - name: Validate benchmark tooling without test instrumentation
        run: |
          cmake -S plapoint -B build/plapoint-benchmark -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps" \
            -DPLAPOINT_WITH_CUDA=OFF \
            -DPLAPOINT_WITH_OPENCL=OFF \
            -DPLAPOINT_BUILD_TESTS=OFF \
            -DPLAPOINT_BUILD_BENCHMARKS=ON
          cmake --build build/plapoint-benchmark --target plapoint_benchmarks
          ctest --test-dir build/plapoint-benchmark --output-on-failure
          python3 plapoint/scripts/test_python_tools.py

  linux-sanitizer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PlaPoint
        uses: actions/checkout@v7
        with:
          path: plapoint
      - name: Check out PlaMatrix
        uses: actions/checkout@v7
        with:
          repository: guderianXu/plamatrix
          ref: 72489499a7df3e65a0af6aae9446b1d41051a9b7
          path: plamatrix
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libeigen3-dev libgtest-dev ninja-build
      - name: Build sanitizer PlaMatrix
        run: |
          cmake -S plamatrix -B build/plamatrix-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/deps-sanitizer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DPLAMATRIX_WITH_CUDA=OFF \
            -DPLAMATRIX_WITH_OPENCL=OFF \
            -DPLAMATRIX_BUILD_TESTS=OFF \
            -DPLAMATRIX_BUILD_BENCHMARKS=OFF
          cmake --build build/plamatrix-sanitizer --target install
      - name: Build and test PlaPoint with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S plapoint -B build/plapoint-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-sanitizer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DPLAPOINT_WITH_CUDA=OFF \
            -DPLAPOINT_WITH_OPENCL=OFF \
            -DPLAPOINT_BUILD_TESTS=ON \
            -DPLAPOINT_BUILD_BENCHMARKS=OFF
          cmake --build build/plapoint-sanitizer
          ctest --test-dir build/plapoint-sanitizer --output-on-failure

  linux-opencl-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PlaPoint
        uses: actions/checkout@v7
        with:
          path: plapoint
      - name: Check out PlaMatrix
        uses: actions/checkout@v7
        with:
          repository: guderianXu/plamatrix
          ref: 72489499a7df3e65a0af6aae9446b1d41051a9b7
          path: plamatrix
      - name: Install OpenCL build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev libeigen3-dev libgtest-dev ninja-build ocl-icd-opencl-dev pocl-opencl-icd
      - name: Build and install OpenCL PlaMatrix
        run: |
          cmake -S plamatrix -B build/plamatrix-opencl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/deps-opencl" \
            -DPLAMATRIX_WITH_CUDA=OFF \
            -DPLAMATRIX_WITH_OPENCL=ON \
            -DPLAMATRIX_BUILD_TESTS=ON \
            -DPLAMATRIX_BUILD_BENCHMARKS=OFF
          cmake --build build/plamatrix-opencl
          ctest --test-dir build/plamatrix-opencl --output-on-failure
          cmake --install build/plamatrix-opencl
      - name: Build and test PlaPoint OpenCL paths
        run: |
          cmake -S plapoint -B build/plapoint-opencl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-opencl" \
            -DPLAPOINT_WITH_CUDA=OFF \
            -DPLAPOINT_WITH_OPENCL=ON \
            -DPLAPOINT_BUILD_TESTS=ON \
            -DPLAPOINT_BUILD_BENCHMARKS=OFF
          cmake --build build/plapoint-opencl
          ctest --test-dir build/plapoint-opencl --output-on-failure

  linux-cuda-build-and-tests:
    name: Linux CUDA compile and host smoke tests
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.4.1-devel-ubuntu24.04
    timeout-minutes: 45
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++ git libboost-dev libeigen3-dev libgtest-dev ninja-build
      - name: Check out PlaPoint
        uses: actions/checkout@v7
        with:
          path: plapoint
      - name: Check out PlaMatrix
        uses: actions/checkout@v7
        with:
          repository: guderianXu/plamatrix
          ref: 72489499a7df3e65a0af6aae9446b1d41051a9b7
          path: plamatrix
      - name: Build and install CUDA PlaMatrix
        run: |
          cmake -S plamatrix -B build/plamatrix-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/deps-cuda" \
            -DPLAMATRIX_WITH_CUDA=ON \
            -DPLAMATRIX_WITH_OPENCL=OFF \
            -DPLAMATRIX_BUILD_TESTS=OFF \
            -DPLAMATRIX_BUILD_BENCHMARKS=OFF
          cmake --build build/plamatrix-cuda --target install
      - name: Build CUDA paths and run host-visible tests
        run: |
          cmake -S plapoint -B build/plapoint-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-cuda" \
            -DPLAPOINT_WITH_CUDA=ON \
            -DPLAPOINT_WITH_OPENCL=OFF \
            -DPLAPOINT_BUILD_TESTS=ON \
            -DPLAPOINT_BUILD_BENCHMARKS=OFF \
            -DPLAPOINT_REQUIRE_CUDA_TEST_DEVICE=OFF
          cmake --build build/plapoint-cuda
          ctest --test-dir build/plapoint-cuda --output-on-failure

  windows-msvc-build:
    runs-on: windows-latest
    steps:
      - name: Check out PlaPoint
        uses: actions/checkout@v7
        with:
          path: plapoint
      - name: Check out PlaMatrix
        uses: actions/checkout@v7
        with:
          repository: guderianXu/plamatrix
          ref: 72489499a7df3e65a0af6aae9446b1d41051a9b7
          path: plamatrix
      - name: Check out GoogleTest
        uses: actions/checkout@v7
        with:
          repository: google/googletest
          ref: v1.18.0
          path: googletest
      - name: Install Eigen and Boost headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            throw "GitHub runner vcpkg was not found at $vcpkg"
          }
          & $vcpkg install `
            eigen3:x64-windows `
            boost-mpl:x64-windows `
            boost-preprocessor:x64-windows `
            --x-install-root="$pwd/build/vcpkg_installed"
      - name: Build and install GoogleTest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S googletest -B build/googletest -A x64 `
            -DCMAKE_INSTALL_PREFIX="$pwd/build/deps" `
            -Dgtest_force_shared_crt=ON
          cmake --build build/googletest --config Release --target install
      - name: Build and install CPU PlaMatrix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S plamatrix -B build/plamatrix -A x64 `
            -DCMAKE_INSTALL_PREFIX="$pwd/build/deps" `
            -DOpenMP_CXX_FLAGS="/openmp:llvm /openmp:experimental" `
            -DPLAMATRIX_WITH_CUDA=OFF `
            -DPLAMATRIX_WITH_OPENCL=OFF `
            -DPLAMATRIX_BUILD_TESTS=OFF `
            -DPLAMATRIX_BUILD_BENCHMARKS=OFF
          cmake --build build/plamatrix --config Release --target install
      - name: Build and install PlaPoint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S plapoint -B build/plapoint -A x64 `
            -DCMAKE_PREFIX_PATH="$pwd/build/deps;$pwd/build/vcpkg_installed/x64-windows" `
            -DCMAKE_INSTALL_PREFIX="$pwd/build/install" `
            -DBUILD_SHARED_LIBS=ON `
            -DPLAPOINT_WITH_CUDA=OFF `
            -DPLAPOINT_WITH_OPENCL=OFF `
            -DPLAPOINT_BUILD_TESTS=ON `
            -DPLAPOINT_BUILD_BENCHMARKS=OFF
          cmake --build build/plapoint --config Release --target install
          $env:PATH = "$pwd\build\plapoint\Release;$pwd\build\deps\bin;$env:PATH"
          ctest --test-dir build/plapoint -C Release --output-on-failure
      - name: Build and run installed-package consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S plapoint/cmake/consumer_smoke -B build/consumer -A x64 `
            -DCMAKE_PREFIX_PATH="$pwd/build/install;$pwd/build/deps;$pwd/build/vcpkg_installed/x64-windows"
          cmake --build build/consumer --config Release
          $env:PATH = "$pwd\build\install\bin;$env:PATH"
          & build/consumer/Release/plapoint_consumer_smoke.exe
